services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: products_app
      POSTGRES_DB: products_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
    volumes:
      - products_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products_app -d products_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: products_app
      PGDATABASE: products_db
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in environment}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
      PORT: 3001
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  products_pgdata:
